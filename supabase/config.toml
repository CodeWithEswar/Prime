# PRIME - Supabase Local Development Configuration
project_id = "prime"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3001/**",
  "http://localhost:3001/auth/callback",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3001/**",
  "http://127.0.0.1:3001/auth/callback"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "env(GMAIL_USER)"
pass = "env(GMAIL_PASS)"
admin_email = "env(GMAIL_USER)"
sender_name = "PRIME"

[auth.external.google]
client_id = "736606455987-mlj5derj4jt1r0u8peb0kt85ljcovvqb.apps.googleusercontent.com"
enabled = true
skip_nonce_check = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

